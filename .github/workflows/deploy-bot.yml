name: Mezon Voice Bot
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
      issues: write
      discussions: write
      actions: write
      deployments: write
    env:
      MEZON_TOKEN: ${{ secrets.MEZON_TOKEN }}
      MEZON_BOT_ID: ${{ secrets.MEZON_BOT_ID }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ENABLE_SYNCHRONIZE: ${{ secrets.ENABLE_SYNCHRONIZE }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      PORT: ${{ secrets.PORT }}
      RUNPOD_ENPOINT: ${{ secrets.RUNPOD_ENPOINT }}
      API_KEY: ${{ secrets.API_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_FOLDER: ${{ secrets.MINIO_FOLDER }}
      CDN_URL: ${{ secrets.CDN_URL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      
      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Deploy
        run: yarn start:prod